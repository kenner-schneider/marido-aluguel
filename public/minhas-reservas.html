<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas reservas — MaridoJá</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a class="logo" href="/">
      <svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#1E40AF"/><path d="M22.8 9.5a4.6 4.6 0 0 0-5.9 5.6l-6.6 6.6a1.9 1.9 0 0 0 2.7 2.7l6.6-6.6a4.6 4.6 0 0 0 5.6-5.9l-2.6 2.6-2.4-.7-.7-2.4 2.6-2.6z" fill="#fff"/></svg>
      <span>Marido<em>Já</em></span>
    </a>
    <nav class="nav-links">
      <a href="/profissionais.html">Profissionais</a>
      <a href="/minhas-reservas.html" class="active">Minhas reservas</a>
      <a href="/pro.html">Sou profissional</a>
      <a href="/profissionais.html" class="btn btn-cta btn-sm">Agendar serviço</a>
    </nav>
  </div>
</header>

<div class="container" style="max-width:880px">
  <div class="page-head">
    <h1>Minhas reservas</h1>
    <p>Acompanhe o status dos seus agendamentos. Informe o e-mail usado na contratação.</p>
  </div>

  <div id="okBanner"></div>

  <form id="emailForm" class="panel" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:24px">
    <label class="field" style="flex:1;min-width:240px">Seu e-mail
      <input type="email" id="email" required placeholder="voce@email.com">
    </label>
    <button type="submit" class="btn btn-primary">Ver reservas</button>
  </form>

  <div class="panel" id="listPanel" hidden>
    <h2 style="font-size:1.2rem">Agendamentos</h2>
    <div id="list"></div>
  </div>
  <div class="empty" id="empty" hidden>
    <h3 style="margin-bottom:8px">Nenhuma reserva encontrada</h3>
    <p>Não achamos agendamentos para este e-mail. <a href="/profissionais.html">Agendar um serviço</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
(async function () {
  const cfg = await API.get('/api/config');
  const serviceById = Object.fromEntries(cfg.services.map(s => [s.id, s]));
  const pros = await API.get('/api/pros');
  const proById = Object.fromEntries(pros.map(p => [p.id, p]));

  if (new URLSearchParams(location.search).get('ok')) {
    document.getElementById('okBanner').innerHTML =
      '<p class="notice success">Agendamento enviado! O profissional foi notificado e vai confirmar em breve.</p>';
  }

  const emailInput = document.getElementById('email');
  const saved = localStorage.getItem('maridoja_email');
  if (saved) emailInput.value = saved;

  const listPanel = document.getElementById('listPanel');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  async function load() {
    const email = emailInput.value.trim();
    if (!email) return;
    localStorage.setItem('maridoja_email', email);
    const bookings = await API.get('/api/bookings?email=' + encodeURIComponent(email));
    list.innerHTML = '';
    listPanel.hidden = bookings.length === 0;
    empty.hidden = bookings.length > 0;
    bookings.forEach(b => {
      const s = serviceById[b.serviceId];
      const p = proById[b.proId];
      list.append(el(`<div class="booking-item">
        <div>
          <h4>${esc(s?.name || b.serviceId)} com ${esc(p?.name || 'profissional')}</h4>
          <p class="meta">${fmtDate(b.date)} às ${esc(b.time)} · ${b.hours}h · ${esc(b.address)}</p>
        </div>
        <div style="text-align:right;display:grid;gap:8px;justify-items:end">
          <span class="badge ${esc(b.status)}">${esc(STATUS_LABEL[b.status] || b.status)}</span>
          <span class="money">${fmtBRL(b.price)}</span>
        </div>
      </div>`));
    });
  }

  document.getElementById('emailForm').addEventListener('submit', e => { e.preventDefault(); load(); });
  if (emailInput.value) load();
})();
</script>
</body>
</html>
